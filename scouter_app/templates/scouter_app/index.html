<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scouter LoL — Análisis Estratégico</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0e1a; color: #c8d6e5; min-height: 100vh; }
        header { background: #111827; border-bottom: 2px solid #c89b3c; padding: 1.2rem 2rem; display: flex; align-items: center; gap: 1rem; }
        header h1 { font-size: 1.6rem; color: #c89b3c; letter-spacing: 2px; }
        header span { color: #7f8ea3; font-size: 0.9rem; }
        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
        .teams-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
        .team-card { background: #111827; border-radius: 10px; padding: 1.5rem; border: 1px solid #1e2d3d; }
        .team-card.ally  { border-top: 3px solid #3b82f6; }
        .team-card.enemy { border-top: 3px solid #ef4444; }
        .team-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 1.2rem; letter-spacing: 1px; }
        .ally  .team-title { color: #3b82f6; }
        .enemy .team-title { color: #ef4444; }
        .lane-row { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 0.8rem; }
        .lane-label { width: 65px; font-size: 0.8rem; color: #7f8ea3; text-transform: uppercase; letter-spacing: 1px; flex-shrink: 0; }
        select { flex: 1; background: #1e2d3d; border: 1px solid #2d3f55; color: #c8d6e5; padding: 0.5rem 0.8rem; border-radius: 6px; font-size: 0.9rem; cursor: pointer; }
        select:focus { outline: none; border-color: #c89b3c; }
        .btn-submit { display: block; width: 100%; margin-top: 2rem; padding: 1rem; background: #c89b3c; color: #0a0e1a; font-size: 1rem; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; letter-spacing: 2px; text-transform: uppercase; transition: background 0.2s; }
        .btn-submit:hover { background: #e0b44a; }
        .loading { display: none; text-align: center; margin-top: 1rem; color: #c89b3c; }
        #report-section { margin-top: 2.5rem; display: none; }
        .strategies { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .strategy-badge { background: #1e2d3d; border: 1px solid #c89b3c; border-radius: 20px; padding: 0.4rem 1rem; font-size: 0.85rem; }
        .strategy-badge span { color: #c89b3c; font-weight: 700; }
        .report-box { background: #111827; border: 1px solid #1e2d3d; border-radius: 10px; padding: 1.5rem; white-space: pre-wrap; font-size: 0.85rem; line-height: 1.7; color: #a8b8cc; max-height: 600px; overflow-y: auto; }
        .error-box { background: #2d1515; border: 1px solid #ef4444; border-radius: 8px; padding: 1rem; color: #ef4444; margin-top: 1rem; }
    </style>
</head>
<body>
<header>
    <h1>⚔ SCOUTER LOL</h1>
    <span>Sistema de Análisis Estratégico Competitivo</span>
</header>

<div class="container">
    <form id="scouting-form">
        {% csrf_token %}
        <div class="teams-grid">
            <!-- EQUIPO ALIADO -->
            <div class="team-card ally">
                <div class="team-title">🔵 EQUIPO ALIADO</div>
                {% for lane in lanes %}
                <div class="lane-row">
                    <span class="lane-label">{{ lane }}</span>
                    <select name="ally_{{ lane|lower }}" required>
                        <option value="">— Seleccionar —</option>
                        {% for champ in champions %}
                        <option value="{{ champ }}">{{ champ }}</option>
                        {% endfor %}
                    </select>
                </div>
                {% endfor %}
            </div>

            <!-- EQUIPO RIVAL -->
            <div class="team-card enemy">
                <div class="team-title">🔴 EQUIPO RIVAL</div>
                {% for lane in lanes %}
                <div class="lane-row">
                    <span class="lane-label">{{ lane }}</span>
                    <select name="enemy_{{ lane|lower }}" required>
                        <option value="">— Seleccionar —</option>
                        {% for champ in champions %}
                        <option value="{{ champ }}">{{ champ }}</option>
                        {% endfor %}
                    </select>
                </div>
                {% endfor %}
            </div>
        </div>

        <button type="submit" class="btn-submit">⚡ Generar Scouting</button>
        <div class="loading" id="loading">Analizando composiciones...</div>
    </form>

    <!-- RESULTADO -->
    <div id="report-section">
        <div class="strategies" id="strategies-container"></div>
        <div class="report-box" id="report-box"></div>
    </div>
    <div class="error-box" id="error-box" style="display:none;"></div>
</div>

<script>
document.getElementById('scouting-form').addEventListener('submit', async function(e) {
    e.preventDefault();

    document.getElementById('loading').style.display = 'block';
    document.getElementById('report-section').style.display = 'none';
    document.getElementById('error-box').style.display = 'none';

    const formData = new FormData(this);
    const data = Object.fromEntries(formData.entries());

    try {
        const response = await fetch('/api/scouting/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': data.csrfmiddlewaretoken,
            },
            body: JSON.stringify(data),
        });

        const result = await response.json();
        document.getElementById('loading').style.display = 'none';

        if (result.error) {
            document.getElementById('error-box').textContent = result.error;
            document.getElementById('error-box').style.display = 'block';
            return;
        }

        // Mostrar top estrategias
        const sc = document.getElementById('strategies-container');
        sc.innerHTML = '';
        result.top_strategies.forEach(([name, conf]) => {
            sc.innerHTML += `<div class="strategy-badge">${name} <span>${(conf*100).toFixed(1)}%</span></div>`;
        });

        document.getElementById('report-box').textContent = result.report;
        document.getElementById('report-section').style.display = 'block';

    } catch (err) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error-box').textContent = 'Error de conexión: ' + err.message;
        document.getElementById('error-box').style.display = 'block';
    }
});
</script>
</body>
</html>
